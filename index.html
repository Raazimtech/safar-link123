<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--primary:#2563eb;--primary2:#1d4ed8;--danger:#dc2626;--dark:#0b1220;--dark2:#111a2e;--shadow:0 12px 35px rgba(16,24,40,.08);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:var(--dark);color:white}.login-left{padding:clamp(30px,7vw,90px);display:flex;flex-direction:column;justify-content:center;background:linear-gradient(135deg,#0b1220,#101b35)}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px}.logo{width:42px;height:42px;border-radius:12px;background:#2563eb;display:grid;place-items:center;font-weight:900}.eyebrow{text-transform:uppercase;letter-spacing:.11em;font-size:11px;font-weight:800;color:#2563eb}.login-left .eyebrow{margin-top:70px;color:#7aa7ff}.login-left h1{font-size:clamp(38px,5vw,68px);line-height:1.02;max-width:650px;margin:12px 0 18px}.login-left p{color:#aab6ca;max-width:580px;font-size:17px;line-height:1.7}.points{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}.point{padding:10px 13px;border:1px solid #263653;border-radius:999px;color:#d5dceb;font-size:13px}.login-right{background:#fff;color:var(--text);display:grid;place-items:center;padding:30px}.card{width:min(440px,100%);padding:36px;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.card h2{font-size:30px;margin:8px 0}.card p{color:var(--muted);line-height:1.6}.form{display:grid;gap:15px}.form label{display:grid;gap:7px;font-size:13px;font-weight:700}.form input,.form select,.form textarea,.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;outline:0}.form input:focus,.form select:focus,.form textarea:focus,.search input:focus{border-color:#7aa7ff;box-shadow:0 0 0 3px #dbe8ff}.primary,.secondary,.danger,.linkbtn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px}.primary{background:var(--primary);color:#fff}.primary:hover{background:var(--primary2)}.secondary{background:#eef2f7;color:#344054}.danger{background:#fee4e2;color:#b42318}.text-btn{border:0;background:none;color:var(--primary);font-weight:700;padding:8px 0}.error{background:#fff1f0;color:#b42318;border:1px solid #fecdca;border-radius:10px;padding:10px;font-size:13px}
.app{min-height:100vh;display:flex}.sidebar{width:250px;background:var(--dark);color:white;position:fixed;inset:0 auto 0 0;padding:18px;display:flex;flex-direction:column;z-index:20}.side-brand{display:flex;align-items:center;gap:10px;padding:8px 5px 25px}.side-brand .logo{width:36px;height:36px}.side-brand small{display:block;color:#8996ad;font-size:11px;margin-top:2px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aab6ca;padding:11px 12px;border-radius:9px;text-align:left;display:flex;align-items:center;gap:10px;font-weight:700}.nav button:hover,.nav button.active{background:#182541;color:white}.account{margin-top:auto;border-top:1px solid #202d46;padding:15px 5px}.avatar{width:36px;height:36px;border-radius:50%;background:#2563eb;display:grid;place-items:center;font-weight:900;float:left;margin-right:10px}.account b{display:block;padding-top:2px;font-size:13px}.account small{color:#8996ad}.account button{margin-top:15px;border:0;background:none;color:#aab6ca;padding:0;display:flex;gap:7px;align-items:center}.main{margin-left:250px;flex:1;min-width:0}.topbar{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:10}.topbar h1{margin:2px 0 0;font-size:24px}.online{font-size:12px;color:#027a48;background:#ecfdf3;border:1px solid #abefc6;padding:7px 10px;border-radius:999px;font-weight:800}.content{padding:30px;max-width:1500px;margin:auto}.welcome{background:#101a30;color:white;border-radius:18px;padding:28px;display:flex;justify-content:space-between;align-items:center;gap:20px}.welcome h2{margin:6px 0;font-size:28px}.welcome p{margin:0;color:#aab6ca}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:18px 0}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 18px rgba(16,24,40,.035)}.stat{padding:18px}.stat-icon{width:38px;height:38px;border-radius:10px;background:#eff4ff;color:#2563eb;display:grid;place-items:center;margin-bottom:17px}.stat small{display:block;color:var(--muted)}.stat b{display:block;font-size:28px;margin-top:3px}.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.panel{padding:20px}.head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.head h3{margin:0;font-size:16px}.head p{margin:4px 0 0;color:var(--muted);font-size:13px}.linkbtn{background:none;color:var(--primary);padding:5px}.activity,.exam-row{display:flex;align-items:center;gap:13px;padding:14px 0;border-top:1px solid #f0f2f5}.activity:first-of-type,.exam-row:first-of-type{border-top:0}.activity small,.exam-row small{display:block;color:var(--muted);margin-top:3px}.activity strong{margin-left:auto}.snapshot{display:grid;gap:12px}.snapshot span{display:flex;justify-content:space-between;padding:12px;background:#f8fafc;border-radius:10px;color:var(--muted)}.snapshot b{color:var(--text)}
.page-title{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}.page-title h2{margin:4px 0}.page-title p{margin:0;color:var(--muted);max-width:700px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:16px}.search{position:relative;max-width:380px;width:100%}.search svg{position:absolute;left:11px;top:11px;color:#98a2b3;width:17px}.search input{padding-left:36px}.toolbar small{color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-top:1px solid var(--line);font-size:13px}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;border-top:0}.badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800;background:#eef2ff;color:#3730a3}.icon{border:0;background:#f2f4f7;border-radius:8px;padding:8px;display:inline-grid;place-items:center;color:#344054}.danger-icon{color:#b42318;background:#fff1f0}.grow{flex:1}.exam-icon{width:42px;height:42px;background:#eff4ff;color:#2563eb;border-radius:10px;display:grid;place-items:center}.empty{text-align:center;color:var(--muted);padding:40px 15px}.modal-back{position:fixed;inset:0;background:rgba(2,6,23,.55);display:grid;place-items:center;padding:20px;z-index:50}.modal{background:#fff;border-radius:18px;width:min(650px,100%);max-height:90vh;overflow:auto;box-shadow:0 25px 80px rgba(0,0,0,.25)}.modal-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0}.modal-body{padding:22px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:8px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.qbox{border:1px solid var(--line);border-radius:12px;padding:15px;display:grid;gap:10px}.qhead{display:flex;justify-content:space-between;align-items:center}.option{display:flex;gap:8px;align-items:center}.option input[type=text]{flex:1}.menu{display:none;border:0;background:none}.toast{position:fixed;right:22px;bottom:22px;background:#101828;color:white;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:100;font-size:13px}
@media(max-width:900px){.login{grid-template-columns:1fr}.login-left{display:none}.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.menu{display:block}.topbar{padding:0 18px}.content{padding:18px}.stats{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}.online{display:none}.welcome{align-items:flex-start;flex-direction:column}.page-title{align-items:flex-start;flex-direction:column}.card{padding:26px}.table-wrap{overflow:auto}th,td{white-space:nowrap}.split{grid-template-columns:1fr}}
@media(max-width:520px){.stats{grid-template-columns:1fr}.topbar{height:70px}.topbar h1{font-size:20px}.content{padding:12px}.panel{padding:14px}.welcome{padding:20px}.welcome h2{font-size:23px}}
</style>

<body>
<div id="app"><div class="loading">Loading EduX Administration…</div></div>
<script>
const SUPABASE_URL='https://dpiwdhtbhwjgatvcfkcb.supabase.co';
const SUPABASE_KEY='sb_publishable_PSZnTEo74jObih_6TTpXVQ_tJwzTnXY';
const FUNCTION_URL=SUPABASE_URL+'/functions/v1/edux-admin-v2';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const CLASSES=['Sophomore Software Eng','Junior Software Eng','Senior Software Eng'];
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const email=id=>String(id).trim().toLowerCase()+'@users.edux.app';
let state={tab:'dashboard',users:[],assessments:[],subs:[],profile:null,notice:''};
async function api(action,body={}){const {data:{session}}=await sb.auth.getSession();const r=await fetch(FUNCTION_URL,{method:'POST',headers:{Authorization:`Bearer ${session?.access_token||''}`,'Content-Type':'application/json'},body:JSON.stringify({action,...body})});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}
function login(){document.body.innerHTML=`<div class="login"><section class="login-left"><div class="brand"><div class="logo">E</div>EduX</div><div class="eyebrow">Administration</div><h1>Run the academic system from one place.</h1><p>Create student and teacher accounts, manage assessments, and monitor results through a clean administrator workspace.</p><div class="points"><span class="point">People & permissions</span><span class="point">Assessment control</span><span class="point">Results & performance</span></div></section><section class="login-right"><div class="card"><div class="eyebrow">Secure administrator access</div><h2>Welcome back</h2><p>Sign in with your EduX administrator account.</p><form id="loginForm" class="form"><label>User ID<input id="uid" placeholder="admin" required></label><label>Password<input id="pwd" type="password" minlength="8" placeholder="Password" required></label><div id="loginErr"></div><button class="primary">Sign in</button></form></div></section></div>`;$('#loginForm').onsubmit=async e=>{e.preventDefault();const err=$('#loginErr');err.innerHTML='';const b=e.target.querySelector('button');b.disabled=true;b.textContent='Signing in…';try{const r=await sb.auth.signInWithPassword({email:email($('#uid').value),password:$('#pwd').value});if(r.error)throw r.error;await boot()}catch(x){err.innerHTML=`<div class="error">${esc(x.message)}</div>`;b.disabled=false;b.textContent='Sign in'}}}
async function loadProfile(id){const r=await sb.from('edux_profiles').select('*').eq('id',id).single();if(r.error||r.data?.role!=='admin')return null;return r.data}
async function loadData(){const [u,a,s]=await Promise.all([sb.from('edux_profiles').select('*').order('created_at',{ascending:false}),sb.from('edux_assessments').select('*').order('created_at',{ascending:false}),sb.from('edux_submissions').select('*').order('submitted_at',{ascending:false})]);state.users=u.data||[];state.assessments=a.data||[];state.subs=s.data||[]}
async function boot(){const {data}=await sb.auth.getSession();if(!data.session){login();return}const p=await loadProfile(data.session.user.id);if(!p){await sb.auth.signOut();login();return}state.profile=p;await loadData();render()}
function nav(){return `<aside class="sidebar" id="sidebar"><div class="side-brand"><div class="logo">E</div><div><b>EduX</b><small>Administration</small></div></div><div class="nav">${[['dashboard','Overview','▦'],['users','People','♙'],['assessments','Assessments','▤'],['results','Results','◫']].map(x=>`<button class="${state.tab===x[0]?'active':''}" data-tab="${x[0]}"><span>${x[2]}</span>${x[1]}</button>`).join('')}</div><div class="account"><div class="avatar">${esc(state.profile.user_id[0]?.toUpperCase()||'A')}</div><b>${esc(state.profile.user_id)}</b><small>Administrator</small><button id="signout">↪ Sign out</button></div></aside>`}
function render(){document.body.innerHTML=`<div class="app">${nav()}<main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="menu" id="menu">☰</button><div><div class="eyebrow">Administrator</div><h1>${state.tab==='dashboard'?'Overview':state.tab[0].toUpperCase()+state.tab.slice(1)}</h1></div></div><span class="online">● System online</span></header><div class="content" id="content"></div></main><div id="modal"></div><div id="toast"></div></div>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');$('#signout').onclick=async()=>{await sb.auth.signOut();login()};renderContent()}
function renderContent(){if(state.tab==='dashboard')dashboard();if(state.tab==='users')people();if(state.tab==='assessments')assessments();if(state.tab==='results')results()}
function pageTitle(ey,title,desc,button=''){return `<div class="page-title"><div><div class="eyebrow">${ey}</div><h2>${title}</h2><p>${desc}</p></div>${button?`<button class="primary" id="pageAction">＋ ${button}</button>`:''}</div>`}
function dashboard(){const students=state.users.filter(x=>x.role==='student').length,teachers=state.users.filter(x=>x.role==='teacher').length,avg=state.subs.length?Math.round(state.subs.reduce((n,s)=>n+(s.total_questions?s.score/s.total_questions*100:0),0)/state.subs.length):0;$('#content').innerHTML=`<div class="welcome"><div><div class="eyebrow" style="color:#7aa7ff">EduX control center</div><h2>Everything academic, under control.</h2><p>Manage people, assessments and outcomes from one workspace.</p></div><button class="primary" id="addPerson">＋ Add person</button></div><div class="stats"><div class="stat"><div class="stat-icon">♙</div><small>People</small><b>${state.users.length}</b></div><div class="stat"><div class="stat-icon">◎</div><small>Students</small><b>${students}</b></div><div class="stat"><div class="stat-icon">◇</div><small>Teachers</small><b>${teachers}</b></div><div class="stat"><div class="stat-icon">◫</div><small>Average score</small><b>${avg}%</b></div></div><div class="cols"><section class="panel"><div class="head"><div><h3>Latest submissions</h3><p>Recent student activity</p></div><button class="linkbtn" id="viewResults">View all →</button></div>${state.subs.slice(0,7).map(s=>{const u=state.users.find(x=>x.id===s.student_id),a=state.assessments.find(x=>x.id===s.assessment_id);return `<div class="activity"><div><b>${esc(u?.user_id||'Student')}</b><small>${esc(a?.title||'Assessment')}</small></div><strong>${s.total_questions?Math.round(s.score/s.total_questions*100):0}%</strong></div>`}).join('')||'<div class="empty">No submissions yet.</div>'}</section><section class="panel"><div class="head"><div><h3>System snapshot</h3><p>Current EduX inventory</p></div></div><div class="snapshot"><span>Assessments <b>${state.assessments.length}</b></span><span>Classes <b>${new Set(state.users.map(x=>x.class_name).filter(Boolean)).size}</b></span><span>Submissions <b>${state.subs.length}</b></span></div></section></div>`;$('#addPerson').onclick=()=>userModal();$('#viewResults').onclick=()=>{state.tab='results';render()}}
function people(){const html=pageTitle('Accounts','People','Create and manage the student and teacher accounts used by EduX.','Add person')+`<section class="panel"><div class="toolbar"><div class="search"><span style="position:absolute;left:12px;top:10px;color:#98a2b3">⌕</span><input id="personSearch" style="padding-left:35px" placeholder="Search people…"></div><small id="personCount">${state.users.length} accounts</small></div><div class="table-wrap"><table><thead><tr><th>User ID</th><th>Role</th><th>Class</th><th>Created</th><th></th></tr></thead><tbody id="peopleRows"></tbody></table></div></section>`;$('#content').innerHTML=html;$('#pageAction').onclick=()=>userModal();const fill=()=>{const q=$('#personSearch').value.toLowerCase();const list=state.users.filter(u=>(u.user_id+' '+u.role+' '+(u.class_name||'')).toLowerCase().includes(q));$('#personCount').textContent=list.length+' accounts';$('#peopleRows').innerHTML=list.map(u=>`<tr><td><b>${esc(u.user_id)}</b></td><td><span class="badge">${esc(u.role)}</span></td><td>${esc(u.class_name||'—')}</td><td>${new Date(u.created_at).toLocaleDateString()}</td><td><button class="icon" data-edit="${u.id}">✎</button></td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">No people found.</div></td></tr>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>userModal(state.users.find(u=>u.id===b.dataset.edit)))};$('#personSearch').oninput=fill;fill()}
function userModal(user=null){const edit=!!user;$('#modal').innerHTML=`<div class="modal-back"><div class="modal"><div class="modal-head"><h3>${edit?'Edit account':'Create account'}</h3><button class="icon" id="closeModal">×</button></div><div class="modal-body"><form id="userForm" class="form"><label>User ID<input id="muid" value="${esc(user?.user_id||'')}" ${edit?'disabled':''} placeholder="student_001" required></label><label>Role<select id="mrole"><option ${user?.role==='student'?'selected':''}>student</option><option ${user?.role==='teacher'?'selected':''}>teacher</option><option ${user?.role==='admin'?'selected':''}>admin</option></select></label><label id="classLabel">Class<select id="mclass"><option value="">No class</option>${CLASSES.map(c=>`<option ${user?.class_name===c?'selected':''}>${c}</option>`).join('')}</select></label><label>${edit?'New password (optional)':'Password'}<input id="mpw" type="password" minlength="8" placeholder="At least 8 characters" ${edit?'':'required'}></label><div id="userErr"></div><div class="actions"><button type="button" class="secondary" id="cancel">Cancel</button>${edit&&user.role!=='admin'?'<button type="button" class="danger" id="deleteUser">Delete</button>':''}<button class="primary">${edit?'Save changes':'Create account'}</button></div></form></div></div></div>`;$('#closeModal').onclick=closeModal;$('#cancel').onclick=closeModal;const role=$('#mrole');const toggle=()=>$('#classLabel').style.display=role.value==='student'?'grid':'none';role.onchange=toggle;toggle();$('#userForm').onsubmit=async e=>{e.preventDefault();const err=$('#userErr'),b=e.target.querySelector('.primary');err.innerHTML='';b.disabled=true;b.textContent='Saving…';try{const body={user_id:$('#muid').value.trim(),role:role.value,class_name:$('#mclass').value,password:$('#mpw').value||undefined};await api(edit?'update_user':'create_user',body);await loadData();closeModal();toast(edit?'Account updated.':'Account created.');people()}catch(x){err.innerHTML=`<div class="error">${esc(x.message)}</div>`;b.disabled=false;b.textContent=edit?'Save changes':'Create account'}};if(edit&&user.role!=='admin')$('#deleteUser').onclick=async()=>{if(!confirm('Delete this account permanently?'))return;try{await api('delete_user',{user_id:user.user_id});await loadData();closeModal();toast('Account deleted.');people()}catch(x){toast(x.message)}}}
function assessments(){const html=pageTitle('Academic content','Assessments','Review, create, edit or remove exams used by teachers and students.','New assessment')+`<section class="panel"><div class="toolbar"><div class="search"><span style="position:absolute;left:12px;top:10px;color:#98a2b3">⌕</span><input id="examSearch" style="padding-left:35px" placeholder="Search assessments…"></div><small id="examCount">${state.assessments.length} assessments</small></div><div id="examRows"></div></section>`;$('#content').innerHTML=html;$('#pageAction').onclick=()=>examModal();const fill=()=>{const q=$('#examSearch').value.toLowerCase(),list=state.assessments.filter(a=>(a.title+' '+a.class_name).toLowerCase().includes(q));$('#examCount').textContent=list.length+' assessments';$('#examRows').innerHTML=list.map(a=>`<div class="exam-row"><div class="exam-icon">▤</div><div class="grow"><b>${esc(a.title)}</b><small>${esc(a.class_name)} · ${(a.questions||[]).length} questions · ${a.duration_minutes||0} min · by ${esc(state.users.find(u=>u.id===a.author_id)?.user_id||'Admin')}</small></div><button class="icon" data-exam-edit="${a.id}">✎</button><button class="icon danger-icon" data-exam-del="${a.id}">⌫</button></div>`).join('')||'<div class="empty">No assessments found.</div>';document.querySelectorAll('[data-exam-edit]').forEach(b=>b.onclick=()=>examModal(state.assessments.find(a=>a.id===b.dataset.examEdit)));document.querySelectorAll('[data-exam-del]').forEach(b=>b.onclick=()=>deleteExam(b.dataset.examDel))};$('#examSearch').oninput=fill;fill()}
function deleteExam(id){if(!confirm('Delete this assessment?'))return;sb.from('edux_assessments').delete().eq('id',id).then(async r=>{if(r.error)toast(r.error.message);else{await loadData();toast('Assessment deleted.');assessments()}})}
function examModal(a=null){a=a||{title:'',class_name:'',duration_minutes:30,questions:[{text:'',options:['','','',''],answer:0}]};let qs=JSON.parse(JSON.stringify(a.questions||[]));if(!qs.length)qs=[{text:'',options:['','','',''],answer:0}];const draw=()=>{$('#questions').innerHTML=qs.map((q,i)=>`<div class="qbox"><div class="qhead"><b>Question ${i+1}</b>${qs.length>1?`<button type="button" class="danger" data-rm-q="${i}">Remove</button>`:''}</div><textarea data-q-text="${i}" rows="2" placeholder="Question text">${esc(q.text)}</textarea>${q.options.map((o,j)=>`<div class="option"><input type="radio" name="answer${i}" data-answer="${i}" value="${j}" ${Number(q.answer)===j?'checked':''}><input type="text" data-opt="${i}:${j}" value="${esc(o)}" placeholder="Option ${j+1}"></div>`).join('')}</div>`).join('');document.querySelectorAll('[data-rm-q]').forEach(b=>b.onclick=()=>{qs.splice(Number(b.dataset.rmQ),1);draw()})};$('#modal').innerHTML=`<div class="modal-back"><div class="modal"><div class="modal-head"><h3>${a.id?'Edit assessment':'Create assessment'}</h3><button class="icon" id="closeModal">×</button></div><div class="modal-body"><form id="examForm" class="form"><label>Title<input id="etitle" value="${esc(a.title)}" required></label><div class="split"><label>Class<select id="eclass" required><option value="">Select class</option>${CLASSES.map(c=>`<option ${a.class_name===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Duration (minutes)<input id="eduration" type="number" min="1" value="${Number(a.duration_minutes)||30}" required></label></div><div id="questions"></div><button type="button" class="secondary" id="addQuestion">＋ Add question</button><div id="examErr"></div><div class="actions"><button type="button" class="secondary" id="cancel">Cancel</button><button class="primary">${a.id?'Save changes':'Create assessment'}</button></div></form></div></div></div>`;$('#closeModal').onclick=closeModal;$('#cancel').onclick=closeModal;$('#addQuestion').onclick=()=>{qs.push({text:'',options:['','','',''],answer:0});draw()};draw();$('#examForm').onsubmit=async e=>{e.preventDefault();qs.forEach((q,i)=>{q.text=document.querySelector(`[data-q-text="${i}"]`).value;q.options=q.options.map((_,j)=>document.querySelector(`[data-opt="${i}:${j}"]`).value);q.answer=Number(document.querySelector(`input[data-answer="${i}"]:checked`)?.value||0)});if(!$('#eclass').value||qs.some(q=>!q.text.trim()||q.options.some(o=>!o.trim()))){$('#examErr').innerHTML='<div class="error">Complete the class, question text and all four options.</div>';return}const b=e.target.querySelector('.primary');b.disabled=true;b.textContent='Saving…';try{const {data:{user}}=await sb.auth.getUser();const payload={title:$('#etitle').value.trim(),class_name:$('#eclass').value,duration_minutes:Number($('#eduration').value),questions:qs,author_id:a.author_id||user.id,updated_at:new Date().toISOString()};const r=a.id?await sb.from('edux_assessments').update(payload).eq('id',a.id):await sb.from('edux_assessments').insert(payload);if(r.error)throw r.error;await loadData();closeModal();toast(a.id?'Assessment updated.':'Assessment created.');assessments()}catch(x){$('#examErr').innerHTML=`<div class="error">${esc(x.message)}</div>`;b.disabled=false;b.textContent=a.id?'Save changes':'Create assessment'}}}
function results(){const rows=state.subs.map(s=>{const u=state.users.find(x=>x.id===s.student_id),a=state.assessments.find(x=>x.id===s.assessment_id),pct=s.total_questions?Math.round(s.score/s.total_questions*100):0;return `<tr><td><b>${esc(u?.user_id||'Unknown')}</b></td><td>${esc(a?.title||'Deleted assessment')}</td><td>${s.score}/${s.total_questions||0}</td><td><span class="badge">${pct}%</span></td><td>${s.submitted_at?new Date(s.submitted_at).toLocaleString():'—'}</td></tr>`}).join('');$('#content').innerHTML=pageTitle('Performance','Results','Review submitted exams and student performance.')+`<section class="panel"><div class="toolbar"><b>${state.subs.length} submissions</b></div><div class="table-wrap"><table><thead><tr><th>Student</th><th>Assessment</th><th>Score</th><th>Percent</th><th>Submitted</th></tr></thead><tbody>${rows||'<tr><td colspan="5"><div class="empty">No submissions yet.</div></td></tr>'}</tbody></table></div></section>`}
function closeModal(){$('#modal').innerHTML=''}function toast(msg){$('#toast').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('#toast').innerHTML='',2600)}
sb.auth.onAuthStateChange(()=>{});boot();
</script>
</body></html>
