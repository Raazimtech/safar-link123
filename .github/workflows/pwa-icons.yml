name: Generate PWA icons

on:
  push:
    paths:
      - 'favicon.svg'
      - '.github/workflows/pwa-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate PNG app icons from the existing favicon
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save sharp@0.33.5 >/dev/null 2>&1
          node - <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          fs.mkdirSync('icons', { recursive: true });
          const input = 'favicon.svg';
          Promise.all([
            sharp(input).resize(192, 192, { fit: 'contain' }).png().toFile('icons/icon-192.png'),
            sharp(input).resize(512, 512, { fit: 'contain' }).png().toFile('icons/icon-512.png'),
            sharp(input).resize(512, 512, { fit: 'contain', background: { r: 255, g: 255, b: 255, alpha: 1 } }).png().toFile('icons/icon-512-maskable.png')
          ]).catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Commit generated icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icons/icon-192.png icons/icon-512.png icons/icon-512-maskable.png
          git diff --cached --quiet || git commit -m 'Generate PNG PWA icons'
          git push
