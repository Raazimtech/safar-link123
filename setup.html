<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduX — First Admin Setup</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b1220;color:#101828}.wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(460px,100%);background:#fff;border-radius:20px;padding:34px;box-shadow:0 25px 70px #0005}.brand{display:flex;align-items:center;gap:11px;font-weight:850;font-size:20px}.logo{width:44px;height:44px;border-radius:12px;background:#2563eb;color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:#2563eb;margin-top:30px}.card h1{font-size:30px;margin:8px 0}.card p{color:#667085;line-height:1.6}.form{display:grid;gap:15px;margin-top:22px}.form label{display:grid;gap:7px;font-size:13px;font-weight:750}.form input{border:1px solid #d0d5dd;border-radius:10px;padding:12px;font:inherit;outline:0}.form input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #dbeafe}.primary{border:0;border-radius:10px;background:#2563eb;color:#fff;padding:12px 16px;font-weight:800}.primary:disabled{opacity:.6}.error{background:#fff1f0;color:#b42318;border:1px solid #fecdca;padding:11px;border-radius:10px;font-size:13px}.success{background:#ecfdf3;color:#027a48;border:1px solid #abefc6;padding:11px;border-radius:10px;font-size:13px}.note{font-size:12px!important}</style></head><body><main class="wrap"><section class="card"><div class="brand"><div class="logo">E</div>EduX</div><div class="eyebrow">First-time setup</div><h1>Create your first administrator</h1><p>This creates the first EduX administrator. After this, use the normal admin panel to sign in.</p><form id="form" class="form"><label>User ID<input id="uid" placeholder="admin" required></label><label>Email<input id="email" type="email" placeholder="you@example.com" required></label><label>Password<input id="password" type="password" minlength="8" placeholder="At least 8 characters" required></label><div id="msg"></div><button class="primary">Create administrator</button></form><p class="note">Your password is handled by Supabase Auth. It is not stored in this page.</p></section></main><script>const sb=supabase.createClient('https://dpiwdhtbhwjgatvcfkcb.supabase.co','sb_publishable_PSZnTEo74jObih_6TTpXVQ_tJwzTnXY');const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('#form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button'),m=$('#msg');b.disabled=true;b.textContent='Creating…';m.innerHTML='';try{const r=await sb.auth.signUp({email:$('#email').value.trim(),password:$('#password').value});if(r.error)throw r.error;if(!r.data.session){m.innerHTML='<div class="success">Account created. Check your email to confirm it, then open the admin panel and sign in.</div>';b.textContent='Created';return}const c=await sb.rpc('claim_first_admin',{p_user_id:$('#uid').value.trim()});if(c.error)throw c.error;if(!c.data)throw Error('An administrator already exists.');m.innerHTML='<div class="success">Administrator created successfully. You can now open the main admin panel.</div>';b.textContent='Done'}catch(x){m.innerHTML='<div class="error">'+esc(x.message)+'</div>';b.disabled=false;b.textContent='Create administrator'}};</script></body></html>
